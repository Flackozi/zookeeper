name: ISW2 - PathTrie

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build ZooKeeper Jute
        run: mvn -B -ntp -pl zookeeper-jute -am -DskipTests -Dmaven.javadoc.skip=true install

      - name: Run PathTrie project tests
        run: mvn -B -ntp -pl zookeeper-server -Dtest=PathTrieProjectTest -DfailIfNoTests=true test
